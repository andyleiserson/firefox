[DEFAULT]
subsuite = "webgpu"
run-if = [
  "early_beta_or_earlier",
  "os == 'mac' && arch == 'aarch64'",
  "os == 'win'",
]
support-files = ["limits.js"]
prefs = [
  # General prefs for WebGPU tests
  "dom.webgpu.enabled=true",
  "dom.webgpu.service-workers.enabled=true",

  # Ignoring the blocklist is not necessary for this test, because it uses the noop backend.
  # (https://bugzilla.mozilla.org/show_bug.cgi?id=1985348).

  # Prefs specific to this test
  "dom.webgpu.wgpu-backend=noop",
  # Disable all fingerprinting protection to get raw/unlimited noop limits
  "privacy.baselineFingerprintingProtection=false",
  "privacy.fingerprintingProtection.pbmode=false",
]

# WebGPU is only available in secure contexts.
#
# See spec WebIDL, like this: https://www.w3.org/TR/webgpu/#navigatorgpu
scheme = "https"

["test_rfp_off.html"]
